name: OpenCode AI Agent

on:
  issue_comment:
    types: [created]

jobs:
  opencode-agent:
    # Only run if someone triggers the /oc or /opencode command
    if: startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenCode Agent
        uses: huggingface/opencode-action@v1 # Official Hugging Face Action
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          model: "Qwen/Qwen2.5-Coder-32B-Instruct"
